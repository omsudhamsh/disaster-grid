<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>Disaster Grid — Emergency Intelligence</title>
    <script>
      /*
       * Theme bootstrap: runs before first paint so the AMOLED dark
       * console (or a persisted light mode) never flashes the wrong
       * theme. Default: dark; honours a saved choice, then the OS
       * preference on first visit.
       */
      (function () {
        var theme = "dark";
        try {
          var saved = localStorage.getItem("dg-theme");
          if (saved === "light" || saved === "dark") {
            theme = saved;
          } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
            theme = "light";
          }
        } catch (error) {
          /* storage unavailable — fall back to dark */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
